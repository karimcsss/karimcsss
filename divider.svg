<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 36" width="800" height="36" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FDE" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F6FDE" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FDE" stop-opacity="1"/>
      <stop offset="1" stop-color="#2F6FDE" stop-opacity="0"/>
    </linearGradient>
    <g id="star8">
