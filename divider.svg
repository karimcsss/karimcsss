  <rect x="40" y="17" width="316" height="2" fill="url(#l)"/>
  <rect x="444" y="17" width="316" height="2" fill="url(#r)"/>
  <g fill="#8C5A3C">
    <rect x="364" y="15" width="6" height="6" transform="rotate(45 367 18)"/>
    <rect x="430" y="15" width="6" height="6" transform="rotate(45 433 18)"/>
  </g>
  <g class="pulse" transform="translate(400 18)" fill="#E0A23B">
