<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 220" width="1200" height="220" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3A" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#0B1B3A" stop-opacity="1"/>
      <stop offset="1" stop-color="#12274F" stop-opacity="1"/>
    </linearGradient>
    <g id="arch">
      <path d="M0 110 V45 A45 45 0 0 1 90 45 V110 Z" fill="#12274F" stroke="#2F6FDE" stroke-width="2"/>
      <path d="M16 110 V50 A29 29 0 0 1 74 50 V110 Z" fill="#0B1B3A" stroke="#2F6FDE" stroke-width="1.5" stroke-opacity="0.65"/>
    </g>
  </defs>
  <style>
    .tw { animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .lamp { animation: flick 2.6s ease-in-out infinite; }
    @keyframes flick { 0%, 100% { opacity: 0.75; } 45% { opacity: 1; } 62% { opacity: 0.55; } }
  </style>

  <rect width="1200" height="220" fill="url(#night)"/>

  <g fill="#F4F1EA">
    <circle class="tw" cx="80"   cy="98"  r="1.4" style="animation-delay:0.5s"/>
    <circle class="tw" cx="250"  cy="92"  r="1.6" style="animation-delay:1.8s"/>
    <circle class="tw" cx="420"  cy="100" r="1.2" style="animation-delay:0.9s"/>
    <circle class="tw" cx="600"  cy="90"  r="1.6" style="animation-delay:2.4s"/>
    <circle class="tw" cx="760"  cy="99"  r="1.2" style="animation-delay:0.2s"/>
    <circle class="tw" cx="930"  cy="93"  r="1.6" style="animation-delay:1.3s"/>
    <circle class="tw" cx="1120" cy="100" r="1.2" style="animation-delay:2.1s"/>
  </g>

  <g transform="translate(0 110)">
    <use xlink:href="#arch" href="#arch" x="15"/>
    <use xlink:href="#arch" href="#arch" x="135"/>
    <use xlink:href="#arch" href="#arch" x="255"/>
    <use xlink:href="#arch" href="#arch" x="375"/>
    <use xlink:href="#arch" href="#arch" x="495"/>
    <use xlink:href="#arch" href="#arch" x="615"/>
    <use xlink:href="#arch" href="#arch" x="735"/>
    <use xlink:href="#arch" href="#arch" x="855"/>
    <use xlink:href="#arch" href="#arch" x="975"/>
    <use xlink:href="#arch" href="#arch" x="1095"/>
    <g fill="#E0A23B">
      <circle class="lamp" cx="300"  cy="64" r="5" style="animation-delay:0.3s"/>
      <circle class="lamp" cx="660"  cy="64" r="5" style="animation-delay:1.1s"/>
      <circle class="lamp" cx="1020" cy="64" r="5" style="animation-delay:1.9s"/>
    </g>
  </g>
</svg>
