<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Karim Trabelsi">
  <title>Karim Trabelsi</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3A"/>
      <stop offset="1" stop-color="#12274F"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0A23B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E0A23B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade">
      <rect width="1200" height="320" fill="url(#vignette)"/>
    </mask>
    <pattern id="zellige" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2F6FDE" stroke-width="1" stroke-opacity="0.35">
        <rect x="20" y="20" width="40" height="40"/>
        <rect x="20" y="20" width="40" height="40" transform="rotate(45 40 40)"/>
        <circle cx="40" cy="40" r="7"/>
      </g>
      <path d="M0 0 L20 20 M80 0 L60 20 M0 80 L20 60 M80 80 L60 60" fill="none" stroke="#2F6FDE" stroke-width="1" stroke-opacity="0.18"/>
    </pattern>
    <g id="arch">
      <path d="M0 110 V45 A45 45 0 0 1 90 45 V110 Z" fill="#12274F" stroke="#2F6FDE" stroke-width="2"/>
      <path d="M16 110 V50 A29 29 0 0 1 74 50 V110 Z" fill="#0B1B3A" stroke="#2F6FDE" stroke-width="1.5" stroke-opacity="0.65"/>
    </g>
    <g id="star8">
      <rect x="-9" y="-9" width="18" height="18"/>
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>
    </g>
  </defs>
  <style>
    .title { animation: rise 1.4s ease-out both; }
    .sub   { animation: rise 1.4s 0.35s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .tw { animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .glow { animation: glow 5s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
    .lamp { animation: flick 2.6s ease-in-out infinite; }
    @keyframes flick { 0%, 100% { opacity: 0.75; } 45% { opacity: 1; } 62% { opacity: 0.55; } }
  </style>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#zellige)" mask="url(#fade)"/>

  <!-- moon -->
  <circle class="glow" cx="1030" cy="72" r="95" fill="url(#moonGlow)"/>
  <circle cx="1030" cy="72" r="17" fill="#F4F1EA"/>

  <!-- stars -->
  <g fill="#F4F1EA">
    <circle class="tw" cx="60"  cy="40"  r="1.6" style="animation-delay:0s"/>
    <circle class="tw" cx="130" cy="95"  r="1.2" style="animation-delay:1.1s"/>
    <circle class="tw" cx="210" cy="30"  r="1.8" style="animation-delay:2.0s"/>
    <circle class="tw" cx="270" cy="120" r="1.2" style="animation-delay:0.6s"/>
    <circle class="tw" cx="330" cy="55"  r="1.4" style="animation-delay:1.7s"/>
    <circle class="tw" cx="420" cy="28"  r="1.2" style="animation-delay:2.6s"/>
    <circle class="tw" cx="520" cy="46"  r="1.6" style="animation-delay:0.3s"/>
    <circle class="tw" cx="700" cy="36"  r="1.4" style="animation-delay:1.4s"/>
    <circle class="tw" cx="790" cy="62"  r="1.2" style="animation-delay:2.3s"/>
    <circle class="tw" cx="860" cy="26"  r="1.8" style="animation-delay:0.9s"/>
    <circle class="tw" cx="920" cy="118" r="1.2" style="animation-delay:1.9s"/>
    <circle class="tw" cx="1110" cy="38" r="1.6" style="animation-delay:0.4s"/>
    <circle class="tw" cx="1150" cy="130" r="1.2" style="animation-delay:2.8s"/>
    <circle class="tw" cx="90"  cy="170" r="1.2" style="animation-delay:1.3s"/>
    <circle class="tw" cx="1160" cy="190" r="1.4" style="animation-delay:0.2s"/>
  </g>

  <!-- arches (skyline) -->
  <g transform="translate(0 210)">
    <use xlink:href="#arch" href="#arch" x="15"/>
    <use xlink:href="#arch" href="#arch" x="135"/>
    <use xlink:href="#arch" href="#arch" x="255"/>
    <use xlink:href="#arch" href="#arch" x="375"/>
    <use xlink:href="#arch" href="#arch" x="495"/>
    <use xlink:href="#arch" href="#arch" x="615"/>
    <use xlink:href="#arch" href="#arch" x="735"/>
    <use xlink:href="#arch" href="#arch" x="855"/>
    <use xlink:href="#arch" href="#arch" x="975"/>
    <use xlink:href="#arch" href="#arch" x="1095"/>
    <!-- lanterns -->
    <g fill="#E0A23B">
      <circle class="lamp" cx="180"  cy="64" r="5" style="animation-delay:0s"/>
      <circle class="lamp" cx="540"  cy="64" r="5" style="animation-delay:0.8s"/>
      <circle class="lamp" cx="780"  cy="64" r="5" style="animation-delay:1.5s"/>
      <circle class="lamp" cx="1140" cy="64" r="5" style="animation-delay:0.4s"/>
    </g>
    <rect x="0" y="106" width="1200" height="4" fill="#12274F"/>
  </g>

  <!-- title -->
  <text class="title" x="600" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="3" fill="#F4F1EA">Karim Trabelsi</text>

  <!-- ornament -->
  <g>
    <rect x="470" y="140" width="110" height="1.5" fill="#2F6FDE" fill-opacity="0.7"/>
    <rect x="620" y="140" width="110" height="1.5" fill="#2F6FDE" fill-opacity="0.7"/>
    <g class="glow" transform="translate(600 141)" fill="#E0A23B">
      <use xlink:href="#star8" href="#star8"/>
    </g>
  </g>

  <!-- subtitle -->
  <text class="sub" x="600" y="184" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="2.5" fill="#E0A23B"><tspan>AI Engineering</tspan><tspan dx="14" fill="#2F6FDE">|</tspan><tspan dx="14">Data Science</tspan><tspan dx="14" fill="#2F6FDE">|</tspan><tspan dx="14">Applied Mathematics</tspan></text>
</svg>
